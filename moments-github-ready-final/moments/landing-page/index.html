<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moments</title>
    <link rel="stylesheet" href="/moments/app/shared/styles/theme.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
      }

      main {
        width: min(680px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 12px;
        color: var(--brand);
        font-size: clamp(42px, 8vw, 76px);
        line-height: 0.95;
      }

      p {
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        margin-top: 18px;
        min-height: 44px;
        align-items: center;
        border-radius: 999px;
        background: var(--accent);
        color: var(--button-text);
        padding: 0 20px;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Moments</h1>
      <p>Supabase backed test surumu web, PWA ve Android hazirligi ile calisacak sekilde duzenlendi.</p>
      <a href="/preview-dashboard">Preview Dashboard</a>
    </main>
  </body>
</html>
